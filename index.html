<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1f2023">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="描工房">
<title>描工房</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<!-- 作品一覧 -->
<section id="gallery" class="screen">
  <header class="gal-head">
    <h1><img src="icons/icon-192.png" alt="" class="logo">描工房</h1>
    <div class="gal-actions">
      <button id="galNew" class="btn primary">＋ 新規作成</button>
      <button id="galImage" class="btn">画像から作成</button>
      <button id="galOpen" class="btn" title="描工房の作品ファイル（.egk）を開く">作品ファイルを開く</button>
    </div>
  </header>
  <div id="galGrid" class="gal-grid"></div>
  <p id="galEmpty" class="gal-empty" hidden>まだ作品がありません。「＋ 新規作成」から始めましょう。</p>
  <footer class="gal-foot"><span id="galStorage"></span><span id="appVersion"></span></footer>
</section>

<!-- ページ管理 -->
<section id="pages" class="screen" hidden>
  <header class="gal-head">
    <button id="pgBack" class="btn">‹ 作品一覧</button>
    <h1 id="pgTitle" class="pg-title"></h1>
    <div class="gal-actions">
      <button id="pgAdd" class="btn primary">＋ ページ</button>
      <button id="pgAddSpread" class="btn">＋ 見開きページ</button>
      <button id="pgSettings" class="btn">作品の設定</button>
      <button id="pgExport" class="btn">書き出し</button>
    </div>
  </header>
  <div id="pgGrid" class="pg-grid"></div>
  <footer class="gal-foot"><span id="pgInfo"></span><span>ページを押すと開きます。⋯ で追加・複製・並べ替え・削除</span></footer>
</section>

<!-- 編集画面 -->
<section id="editor" class="screen" hidden>
  <header id="topbar">
    <button class="tb-btn" id="btnBack" title="作品一覧へ">‹ 作品</button>
    <nav class="menubar">
      <button class="tb-btn" data-menu="file">ファイル</button>
      <button class="tb-btn" data-menu="edit">編集</button>
      <button class="tb-btn" data-menu="layer">レイヤー</button>
      <button class="tb-btn" data-menu="select">選択範囲</button>
      <button class="tb-btn" data-menu="adjust">色調補正</button>
      <button class="tb-btn" data-menu="filter">フィルター</button>
      <button class="tb-btn" data-menu="manga">マンガ</button>
      <button class="tb-btn" data-menu="view">表示</button>
    </nav>
    <div class="tb-title"><span id="pageNav" class="page-nav" hidden><button class="tb-btn icon" id="pgPrev" title="前のページ（PageUp）">◀</button><button class="tb-btn" id="pageNum" title="ページ管理へ"></button><button class="tb-btn icon" id="pgNext" title="次のページ（PageDown）">▶</button></span><button id="docTitle" class="doc-title" title="作品名を変更"></button><button id="saveState" class="save-state saved">保存済み</button></div>
    <div class="tb-right">
      <button class="tb-btn icon" id="btnFit" title="全体を表示（回転も戻す）">⤢</button>
      <button class="tb-btn icon" id="btnFlip" title="左右反転（Shift+H）">⇋</button>
      <button class="tb-btn snap" id="btnSnap" title="定規に吸い付く／吸い付かない" hidden>定規</button>
      <span class="tb-gap"></span>
      <button class="tb-btn icon big" id="btnUndo" title="取り消し（2本指タップ）">↶</button>
      <button class="tb-btn icon big" id="btnRedo" title="やり直し（3本指タップ）">↷</button>
      <span class="tb-gap"></span>
      <button class="tb-btn icon" id="btnSide" title="右パネル">▥</button>
    </div>
  </header>
  <div id="main">
    <nav id="toolbar" aria-label="ツール"></nav>
    <aside id="leftpanel"><div id="toolprops"></div></aside>
    <div id="viewport">
      <canvas id="view"></canvas>
      <div id="quick"></div>
      <div id="zoomBadge" class="badge" hidden></div>
    </div>
    <aside id="rightpanel" data-focus="both">
      <div class="rp-tabs"><button class="rp-tab" data-focus="color">カラー</button><button class="rp-tab" data-focus="both">両方</button><button class="rp-tab" data-focus="layers">レイヤー</button></div>
      <section id="colorpanel" class="panel"></section>
      <section id="layerpanel" class="panel"></section>
    </aside>
  </div>
</section>

<div id="busy" class="busy" hidden><div class="busy-box"><div class="spinner"></div><span id="busyText"></span></div></div>
<div id="updateBar" class="update-bar" hidden>新しい版に切り替わりました。<button class="btn small">読み込み直す</button><button class="x" aria-label="閉じる">✕</button></div>
<div id="toasts"></div>

<script src="js/util.js"></script>
<script src="js/doc.js"></script>
<script src="js/selection.js"></script>
<script src="js/compose.js"></script>
<script src="js/brush.js"></script>
<script src="js/vector.js"></script>
<script src="js/text.js"></script>
<script src="js/fill.js"></script>
<script src="js/adjust.js"></script>
<script src="js/transform.js"></script>
<script src="js/tools.js"></script>
<script src="js/shapes.js"></script>
<script src="js/seltools.js"></script>
<script src="js/manga.js"></script>
<script src="js/ruler.js"></script>
<script src="js/book.js"></script>
<script src="js/pages.js"></script>
<script src="js/anim.js"></script>
<script src="js/timeline.js"></script>
<script src="js/video.js"></script>
<script src="js/print.js"></script>
<script src="js/goods.js"></script>
<script src="js/view.js"></script>
<script src="js/color.js"></script>
<script src="js/layers.js"></script>
<script src="js/panels.js"></script>
<script src="js/store.js"></script>
<script src="js/app.js"></script>
</body>
</html>
